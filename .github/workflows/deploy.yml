name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t portfolio:latest .

      - name: Tag Docker Image
        run: docker tag portfolio:latest 878451097402.dkr.ecr.eu-north-1.amazonaws.com/portfolio:latest

      - name: Push Docker Image
        run: docker push 878451097402.dkr.ecr.eu-north-1.amazonaws.com/portfolio:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 878451097402.dkr.ecr.eu-north-1.amazonaws.com

            cd ~/Portfolio

            git pull

            docker compose pull

            docker compose up -d --remove-orphans